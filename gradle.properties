org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# GeckoView pulls androidx artifacts compiled with Kotlin 2.4 metadata, which
# AGP 9's bundled 2.2 compiler cannot read. Opt out of built-in Kotlin and drive
# the JetBrains plugin at a matching version instead.
android.builtInKotlin=false
# AGP 9's new DSL is incompatible with the standalone Kotlin plugin. Documented
# bypass; revisit once built-in Kotlin ships a compiler that can read the
# androidx metadata GeckoView drags in.
android.newDsl=false
android.nonTransitiveRClass=true

kotlin.code.style=official

# Kotlin/JS (core-scene) uses the system npm rather than downloading Yarn.
kotlin.js.yarn=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
